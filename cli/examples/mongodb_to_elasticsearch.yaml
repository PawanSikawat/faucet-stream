# YAML equivalent of `faucet-stream/examples/mongodb_to_elasticsearch.rs`.
# MongoDB (filter + projection + sort + limit) → Elasticsearch with id_field.
version: 1
name: mongodb_to_elasticsearch

pipeline:
  source:
    type: mongodb
    config:
      connection_uri: mongodb://localhost:27017
      database: shop
      collection: products
      filter:
        available: true
      projection:
        _id: 1
        name: 1
        description: 1
        tags: 1
      sort:
        updated_at: -1
      limit: 100000
      cursor_batch_size: 1000

  sink:
    type: elasticsearch
    config:
      base_url: https://es.example.com:9200
      index: products
      auth:
        type: basic
        config:
          username: ${env:ES_USER}
          password: ${env:ES_PASS}
      batch_size: 1000
      id_field: _id
