# Prometheus config for the faucet-stream example stack: scrapes a faucet
# process exposing metrics on the host (default exporter port 9464 — enable
# with `observability: { prometheus: { listen_addr: 0.0.0.0:9464 } }`) and
# loads the shipped alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/faucet-alerts.yml

scrape_configs:
  - job_name: faucet
    static_configs:
      # host.docker.internal resolves to the host on Docker Desktop / colima;
      # the extra_hosts entry in docker-compose.yml covers native Linux.
      - targets: ["host.docker.internal:9464"]
  - job_name: faucet-serve
    static_configs:
      - targets: ["host.docker.internal:8080"]
