[package]
name = "faucet-stream"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A declarative, config-driven data pipeline with pluggable source and sink connectors"
readme = "../README.md"
keywords = ["rest", "api", "meltano", "bigquery", "streaming"]
categories = ["web-programming::http-client"]
exclude = [".trunk/"]

[features]
default = ["source-rest"]

## All source connectors.
source = ["source-rest", "source-graphql", "source-xml", "source-grpc"]
## All sink connectors.
sink = ["sink-bigquery", "sink-postgres", "sink-jsonl", "sink-snowflake"]
## Every connector.
full = ["source", "sink"]

## Individual source connectors.
source-rest = ["dep:faucet-source-rest"]
source-graphql = ["dep:faucet-source-graphql"]
source-xml = ["dep:faucet-source-xml"]
source-grpc = ["dep:faucet-source-grpc"]

## Individual sink connectors.
sink-bigquery = ["dep:faucet-sink-bigquery"]
sink-postgres = ["dep:faucet-sink-postgres"]
sink-jsonl = ["dep:faucet-sink-jsonl"]
sink-snowflake = ["dep:faucet-sink-snowflake"]

## Transform features (forwarded to source-rest when enabled).
transform-flatten = ["faucet-source-rest?/transform-flatten"]
transform-rename-keys = ["faucet-source-rest?/transform-rename-keys"]
transform-snake-case = ["faucet-source-rest?/transform-snake-case"]
transforms = ["faucet-source-rest?/transforms"]

[dependencies]
faucet-core.workspace = true
faucet-source-rest = { workspace = true, optional = true }
faucet-source-graphql = { workspace = true, optional = true }
faucet-source-xml = { workspace = true, optional = true }
faucet-source-grpc = { workspace = true, optional = true }
faucet-sink-bigquery = { workspace = true, optional = true }
faucet-sink-postgres = { workspace = true, optional = true }
faucet-sink-jsonl = { workspace = true, optional = true }
faucet-sink-snowflake = { workspace = true, optional = true }
