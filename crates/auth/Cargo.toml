[package]
name = "faucet-auth"
version = "1.0.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared, single-flight authentication providers (OAuth2, token-endpoint) for faucet-stream connectors"
readme = "README.md"
keywords = ["oauth2", "auth", "etl", "pipeline", "faucet"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
reqwest = { workspace = true, features = ["json", "form"] }
jsonpath-rust.workspace = true
tracing.workspace = true
# OAuth1 request signing (#496): RFC 5849 base string + HMAC-SHA256. Optional so
# the base crate stays crypto-free unless OAuth1 is used.
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }

[features]
# OAuth1 (one-legged, HMAC-SHA256) request-signing provider.
oauth1 = ["dep:hmac", "dep:sha2", "dep:base64", "dep:percent-encoding"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
futures.workspace = true
tempfile.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
