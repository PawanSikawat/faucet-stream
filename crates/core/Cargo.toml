[package]
name = "faucet-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types, traits, and utilities for the faucet-stream ecosystem"

[features]
default = ["transform-flatten", "transform-rename-keys", "transform-snake-case"]
transform-flatten = []
transform-rename-keys = ["dep:regex"]
transform-snake-case = ["dep:regex"]
transforms = ["transform-flatten", "transform-rename-keys", "transform-snake-case"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
reqwest.workspace = true
jsonpath-rust.workspace = true
regex = { workspace = true, optional = true }
futures-core.workspace = true
dotenvy = "0.15"
envy = "0.4"

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
futures = "0.3"
