[package]
name = "faucet-source-webhook"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Webhook receiver source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["time", "net", "sync", "macros"] }
axum = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "net", "sync"] }
serde_json.workspace = true
reqwest.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
