[package]
name = "faucet-source-rest"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "REST API source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["transform-flatten", "transform-rename-keys", "transform-snake-case"]
transform-flatten = ["faucet-core/transform-flatten"]
transform-rename-keys = ["faucet-core/transform-rename-keys"]
transform-snake-case = ["faucet-core/transform-snake-case"]
transforms = ["faucet-core/transforms"]

[dependencies]
faucet-core.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonpath-rust = "1"
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
tracing.workspace = true
async-stream = { workspace = true }
futures-core = "0.3.32"
futures.workspace = true  # try_join_all for concurrent partitions
async-trait.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
tracing-subscriber = "0.3"
futures.workspace = true
serde = { version = "1", features = ["derive"] }
tempfile = "3"
async-trait.workspace = true
