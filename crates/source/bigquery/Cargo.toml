[package]
name = "faucet-source-bigquery"
version = "1.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BigQuery query source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["bigquery", "gcp", "etl", "pipeline", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-bigquery.workspace = true
gcp-bigquery-client = "0.28.0"
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
async-stream.workspace = true
tracing.workspace = true
tokio.workspace = true

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
futures = { workspace = true }
serde_json.workspace = true
schemars.workspace = true
wiremock = "0.6"
tempfile = "3"
serde = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
