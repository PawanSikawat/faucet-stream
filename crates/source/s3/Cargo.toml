[package]
name = "faucet-source-s3"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AWS S3 source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["s3", "aws", "storage", "etl", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
async-stream = { workspace = true }
futures.workspace = true
# Checksum verification (opt-in `verify_checksum`): `crc` covers CRC-32 /
# CRC-32C / CRC-64-NVME; `sha2`/`md-5` cover SHA-256 / ETag-MD5; `base64`
# decodes the values S3 advertises.
crc.workspace = true
sha2.workspace = true
md-5.workspace = true
base64.workspace = true

[features]
compression = ["faucet-core/compression"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
futures.workspace = true
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["minio"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
