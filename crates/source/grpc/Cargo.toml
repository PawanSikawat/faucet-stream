[package]
name = "faucet-source-grpc"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "gRPC API source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
tonic.workspace = true
prost.workspace = true
prost-reflect.workspace = true
prost-types.workspace = true
async-stream.workspace = true
futures-core.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync"] }
serde_json.workspace = true
tonic = { workspace = true, features = ["transport", "server"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = { workspace = true }
prost.workspace = true

[build-dependencies]
tonic-build = "0.13"
protoc-bin-vendored = "3"
