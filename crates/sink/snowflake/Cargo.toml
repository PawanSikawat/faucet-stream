[package]
name = "faucet-sink-snowflake"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Snowflake sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["snowflake", "sql", "etl", "sink", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-snowflake.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
# `sync` for the `OnceCell` guarding the one-shot exactly-once watermark-table
# DDL. Declared here (not relied on via feature unification) so the
# feature-isolation CI matrix, which builds this crate alone, still compiles.
tokio = { workspace = true, features = ["sync"] }
reqwest.workspace = true
base64.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json.workspace = true
faucet-conformance.workspace = true
schemars.workspace = true
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
