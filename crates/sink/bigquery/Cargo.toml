[package]
name = "faucet-sink-bigquery"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BigQuery sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["bigquery", "gcp", "etl", "sink", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-bigquery-common.workspace = true
gcp-bigquery-client = "0.28.0"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
tempfile = "3"
serde = { workspace = true }
# Tests only: gunzip captured insertAll request bodies (the client gzips them
# via gcp-bigquery-client's default `gzip` feature) to assert skipInvalidRows.
flate2 = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
