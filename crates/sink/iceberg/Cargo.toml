[package]
name = "faucet-sink-iceberg"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Iceberg sink for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["iceberg", "lakehouse", "sink", "etl", "pipeline"]
categories.workspace = true

[features]
default = ["catalog-rest"]
catalog-rest = ["dep:iceberg-catalog-rest"]
catalog-glue = ["dep:iceberg-catalog-glue"]
catalog-sql  = ["dep:iceberg-catalog-sql"]
catalog-hms  = ["dep:iceberg-catalog-hms"]

[dependencies]
faucet-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
futures.workspace = true
iceberg = "0.9.1"
uuid.workspace = true
# arrow/arrow-json/parquet pinned to iceberg 0.9.1's arrow major (57, NOT workspace 58):
arrow = "57"
arrow-json = "57"
parquet = { version = "57", features = ["async"] }
iceberg-catalog-rest = { version = "0.9.1", optional = true }
iceberg-catalog-glue = { version = "0.9.1", optional = true }
iceberg-catalog-sql  = { version = "0.9.1", optional = true }
iceberg-catalog-hms  = { version = "0.9.1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
tempfile = "3"
iceberg = "0.9.1"
iceberg-catalog-sql = "0.9.1"
# sqlx runtime-tokio must be enabled explicitly here because iceberg-catalog-sql's
# production dep only enables the `any` feature (no runtime).  Without this the
# pool panics at runtime: "either the `runtime-async-std` or `runtime-tokio`
# feature must be enabled".
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "any"] }
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
