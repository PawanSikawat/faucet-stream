[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/source/rest",
    "crates/sink/bigquery",
    "faucet-stream",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PawanSikawat/faucet-stream"

[workspace.dependencies]
# Internal crates
faucet-core = { path = "crates/core", version = "0.1.0" }
faucet-source-rest = { path = "crates/source/rest", version = "0.1.0" }
faucet-sink-bigquery = { path = "crates/sink/bigquery", version = "0.1.0" }

# Shared external deps
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
thiserror = "2"
tracing = "0.1"
async-trait = "0.1.89"
regex = "1"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
