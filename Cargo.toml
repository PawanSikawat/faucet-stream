[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/auth",
    "crates/bigquery-common",
    "crates/elasticsearch-common",
    "crates/gcs-common",
    "crates/kafka-common",
    "crates/snowflake-common",
    "crates/source/rest",
    "crates/source/graphql",
    "crates/source/xml",
    "crates/source/grpc",
    "crates/source/kafka",
    "crates/source/postgres",
    "crates/source/mysql",

    "crates/source/gcs",
    "crates/source/s3",
    "crates/source/mongodb",
    "crates/source/redis",
    "crates/source/webhook",
    "crates/source/websocket",
    "crates/source/sqlite",
    "crates/source/csv",
    "crates/source/elasticsearch",
    "crates/source/parquet",
    "crates/source/postgres-cdc",
    "crates/source/bigquery",
    "crates/source/snowflake",
    "crates/sink/bigquery",
    "crates/sink/postgres",
    "crates/sink/jsonl",
    "crates/sink/snowflake",
    "crates/sink/mysql",
    "crates/sink/sqlite",

    "crates/sink/gcs",
    "crates/sink/s3",
    "crates/sink/mongodb",
    "crates/sink/redis",
    "crates/sink/csv",
    "crates/sink/elasticsearch",
    "crates/sink/http",
    "crates/sink/kafka",
    "crates/sink/stdout",
    "crates/sink/parquet",
    "crates/state/redis",
    "crates/state/postgres",
    "faucet-stream",
    "cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PawanSikawat/faucet-stream"
# Shared crates.io discovery metadata, inherited by connector/state crates via
# `keywords.workspace = true` / `categories.workspace = true` (#78 LOW). Crates
# that want more specific keywords (cli, umbrella) set their own.
keywords = ["etl", "data-pipeline", "streaming", "connector", "faucet"]
categories = ["database", "asynchronous"]

[workspace.dependencies]
# Internal crates
faucet-core = { path = "crates/core", version = "0.2.0" }
faucet-auth = { path = "crates/auth", version = "0.1.0" }
faucet-bigquery-common = { path = "crates/bigquery-common", version = "0.1.0" }
faucet-elasticsearch-common = { path = "crates/elasticsearch-common", version = "0.1.0" }
faucet-gcs-common = { path = "crates/gcs-common", version = "0.2.0" }
faucet-kafka-common = { path = "crates/kafka-common", version = "0.2.0" }
faucet-snowflake-common = { path = "crates/snowflake-common", version = "0.1.0" }
faucet-source-rest = { path = "crates/source/rest", version = "0.2.0" }
faucet-source-graphql = { path = "crates/source/graphql", version = "0.2.0" }
faucet-source-xml = { path = "crates/source/xml", version = "0.2.0" }
faucet-source-grpc = { path = "crates/source/grpc", version = "0.2.0" }
faucet-source-kafka = { path = "crates/source/kafka", version = "0.2.0" }
faucet-sink-bigquery = { path = "crates/sink/bigquery", version = "0.2.0" }
faucet-sink-postgres = { path = "crates/sink/postgres", version = "0.2.0" }
faucet-sink-jsonl = { path = "crates/sink/jsonl", version = "0.2.0" }
faucet-sink-snowflake = { path = "crates/sink/snowflake", version = "0.2.0" }
faucet-source-postgres = { path = "crates/source/postgres", version = "0.2.0" }
faucet-source-postgres-cdc = { path = "crates/source/postgres-cdc", version = "0.2.0" }
faucet-source-mysql = { path = "crates/source/mysql", version = "0.2.0" }

faucet-source-gcs = { path = "crates/source/gcs", version = "0.2.0" }
faucet-source-s3 = { path = "crates/source/s3", version = "0.2.0" }
faucet-source-mongodb = { path = "crates/source/mongodb", version = "0.2.0" }
faucet-source-redis = { path = "crates/source/redis", version = "0.2.0" }
faucet-source-webhook = { path = "crates/source/webhook", version = "0.2.0" }
faucet-source-websocket = { path = "crates/source/websocket", version = "0.1.0" }
faucet-source-sqlite = { path = "crates/source/sqlite", version = "0.2.0" }
faucet-source-csv = { path = "crates/source/csv", version = "0.2.0" }
faucet-source-elasticsearch = { path = "crates/source/elasticsearch", version = "0.3.0" }
faucet-source-parquet = { path = "crates/source/parquet", version = "0.2.0" }
faucet-source-bigquery = { path = "crates/source/bigquery", version = "0.1.0" }
faucet-source-snowflake = { path = "crates/source/snowflake", version = "0.1.0" }
faucet-sink-mysql = { path = "crates/sink/mysql", version = "0.2.0" }
faucet-sink-sqlite = { path = "crates/sink/sqlite", version = "0.2.0" }

faucet-sink-gcs = { path = "crates/sink/gcs", version = "0.2.0" }
faucet-sink-s3 = { path = "crates/sink/s3", version = "0.2.0" }
faucet-sink-mongodb = { path = "crates/sink/mongodb", version = "0.2.0" }
faucet-sink-redis = { path = "crates/sink/redis", version = "0.2.0" }
faucet-sink-csv = { path = "crates/sink/csv", version = "0.2.0" }
faucet-sink-elasticsearch = { path = "crates/sink/elasticsearch", version = "0.3.0" }
faucet-sink-http = { path = "crates/sink/http", version = "0.2.0" }
faucet-sink-kafka = { path = "crates/sink/kafka", version = "0.2.0" }
faucet-sink-stdout = { path = "crates/sink/stdout", version = "0.2.0" }
faucet-sink-parquet = { path = "crates/sink/parquet", version = "0.2.0" }
faucet-state-redis = { path = "crates/state/redis", version = "0.2.0" }
faucet-state-postgres = { path = "crates/state/postgres", version = "0.2.0" }
faucet-cli = { path = "cli", version = "0.2.0" }

# Shared external deps
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1.89"
regex = "1"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
futures-core = "0.3"
jsonpath-rust = "1.0.1"
quick-xml = { version = "0.37", features = ["serialize"] }
tonic = { version = "0.13", features = ["transport", "tls-ring"] }
prost = "0.13"
prost-reflect = { version = "0.15", features = ["serde"] }
prost-types = "0.13"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "json"] }
pgwire-replication = "=0.3.2"
byteorder = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jsonwebtoken = "9"
base64 = "0.22"
rsa = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
google-cloud-storage = "1.12"
google-cloud-auth = "1.10"
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
tokio-util = { version = "0.7", features = ["io"] }

mongodb = "3"
csv = "1.3"
csv-async = { version = "1.3", features = ["tokio"] }
redis = { version = "0.29", features = ["tokio-comp", "aio"] }
axum = "0.8"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
schemars = "1.2.1"
futures = "0.3"
async-stream = "0.3"
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "cmake-build", "ssl-vendored", "sasl"] }
apache-avro = { version = "0.21", default-features = false, features = ["snappy"] }
jsonschema = { version = "0.46", default-features = false }
lru = "0.18"
# Observability fixture. `metrics` and `tracing` are core deps because they are
# zero-cost when no recorder/subscriber is installed and connector authors can
# emit their own counters/spans without adding deps. The heavy exporter
# (`metrics-exporter-prometheus`) and subscriber (`tracing-subscriber`) are
# optional and gated behind faucet-cli's `observability` feature.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
metrics-util = "0.20"
bytes = "1"
url = "2"
urlencoding = "2"
protox = "0.9"
arrow = "58"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
arrow-json = "58"
parquet = { version = "58", features = ["async", "object_store"] }
object_store = "0.13"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }
flate2 = "1"
zstd = "0.13"
glob = "0.3"
