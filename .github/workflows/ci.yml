name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - run: cargo test --workspace --all-features

  # Verify each feature compiles in isolation (catches accidental cross-feature deps)
  feature-check:
    name: Feature isolation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          # Sources
          - source-rest
          - source-graphql
          - source-xml
          - source-grpc
          - source-postgres
          - source-mysql
          - source-sqlite
          - source-s3
          - source-mongodb
          - source-redis
          - source-webhook
          - source-csv
          - source-elasticsearch
          - source-kafka
          # Sinks
          - sink-bigquery
          - sink-postgres
          - sink-jsonl
          - sink-snowflake
          - sink-mysql
          - sink-sqlite
          - sink-s3
          - sink-mongodb
          - sink-redis
          - sink-csv
          - sink-elasticsearch
          - sink-http
          - sink-stdout
          - sink-kafka
          # Kafka extras
          - kafka-schema-registry
          # State-store backends
          - state-redis
          - state-postgres
          # Aggregates
          - source
          - sink
          - state
          - full
          # CLI build matrix — verify the binary builds with every default-on
          # feature plus a slim "only the bare minimum" combo.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-feat-${{ matrix.feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-feat-${{ matrix.feature }}-
      - name: Install librdkafka prerequisites (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - name: Install librdkafka prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl@3 curl
      - run: cargo check -p faucet-stream --no-default-features --features ${{ matrix.feature }}

  cli-build:
    name: CLI build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Defaults pull in every connector; the slim profile covers the
        # smallest interesting combination so accidental cross-feature deps
        # surface immediately.
        features:
          - "full"
          - "source-rest,sink-jsonl,sink-stdout,transforms"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Install librdkafka prerequisites
        if: contains(matrix.features, 'full') || contains(matrix.features, 'kafka')
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cli-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('cli/**/*.rs', 'cli/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cli-
      - run: cargo build -p faucet-cli --no-default-features --features "${{ matrix.features }}"

  kafka-integration:
    name: Kafka integration tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-kafka-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-kafka-integration-
      - name: Run kafka source integration tests
        run: cargo test -p faucet-source-kafka --test integration -- --test-threads=1
      - name: Run kafka sink integration tests
        run: cargo test -p faucet-sink-kafka --test integration -- --test-threads=1
      - name: Run kafka schema-registry-enabled tests
        run: cargo test -p faucet-kafka-common --all-features
