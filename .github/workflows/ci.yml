name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-docs-
      # Fail on any rustdoc warning (broken intra-doc links, etc.) so the
      # docs.rs render stays clean. The `doc_cfg` feature-badge path itself is
      # nightly-only and exercised by docs.rs, not here.
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - run: cargo test --workspace --all-features

  # Verify each feature compiles in isolation (catches accidental cross-feature deps)
  feature-check:
    name: Feature isolation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          # Sources
          - source-rest
          - source-graphql
          - source-xml
          - source-grpc
          - source-postgres
          - source-postgres-cdc
          - source-mysql
          - source-sqlite
          - source-s3
          - source-mongodb
          - source-redis
          - source-webhook
          - source-websocket
          - source-csv
          - source-elasticsearch
          - source-kafka
          - source-parquet
          - source-gcs
          - source-bigquery
          - source-snowflake
          # Sinks
          - sink-bigquery
          - sink-postgres
          - sink-jsonl
          - sink-snowflake
          - sink-mysql
          - sink-sqlite
          - sink-s3
          - sink-mongodb
          - sink-redis
          - sink-csv
          - sink-elasticsearch
          - sink-http
          - sink-stdout
          - sink-kafka
          - sink-parquet
          - sink-gcs
          # Kafka extras
          - kafka-schema-registry
          # State-store backends
          - state-redis
          - state-postgres
          # Aggregates
          - source
          - sink
          - state
          - auth
          - full
          - compression
          # Quality checks
          - quality
          - quality-jsonschema
          # CLI build matrix — verify the binary builds with every default-on
          # feature plus a slim "only the bare minimum" combo.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-feat-${{ matrix.feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-feat-${{ matrix.feature }}-
      - name: Install librdkafka prerequisites (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - name: Install librdkafka prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl@3 curl
      - run: cargo check -p faucet-stream --no-default-features --features ${{ matrix.feature }}

  cli-build:
    name: CLI build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Defaults pull in every connector; the slim profile covers the
        # smallest interesting combination so accidental cross-feature deps
        # surface immediately. The observability+slim combo specifically
        # guards the observability feature against unexpected cross-feature
        # gating regressions (the "full" entry covers observability+everything
        # because the full aggregate now includes observability).
        features:
          - "full"
          - "source-rest,sink-jsonl,sink-stdout,transforms"
          - "observability,source-rest,sink-jsonl,sink-stdout,transforms"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Install librdkafka prerequisites
        if: contains(matrix.features, 'full') || contains(matrix.features, 'kafka')
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cli-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('cli/**/*.rs', 'cli/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cli-
      - run: cargo build -p faucet-cli --no-default-features --features "${{ matrix.features }}"

  observability-bench:
    name: Observability bench (5% regression budget)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-obs-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-obs-bench-
      - name: Run observability benchmark
        run: cargo bench -p faucet-core --bench observability -- --warm-up-time 1 --measurement-time 3 --save-baseline ci
      - name: Check regression threshold
        run: python3 .github/scripts/check_obs_regression.py

  kafka-integration:
    name: Kafka integration tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-kafka-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-kafka-integration-
      - name: Run kafka source integration tests
        run: cargo test -p faucet-source-kafka --test integration -- --test-threads=1
      - name: Run kafka sink integration tests
        run: cargo test -p faucet-sink-kafka --test integration -- --test-threads=1
      - name: Run kafka schema-registry-enabled tests
        run: cargo test -p faucet-kafka-common --all-features
      - name: Run elasticsearch-common tests
        run: cargo test -p faucet-elasticsearch-common

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hard gate: licenses, banned crates, and dependency sources are
      # deterministic and in our control.
      - name: Licenses / bans / sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      # Informational: RustSec advisories. Non-blocking because nearly all live
      # in transitive deps we don't control and the advisory DB updates daily;
      # see the note in deny.toml.
      - name: Advisories (informational)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: llvm-tools-preview
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-
      # Cover library unit tests only (`--lib`). The integration tests in
      # `tests/` spin up Docker testcontainers (Kafka, etc.) whose image pulls
      # are flaky and are already exercised by the `test` and `kafka-integration`
      # jobs — running them here too made coverage non-deterministic.
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --all-features --lib --lcov --output-path lcov.info
      - name: Upload to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
