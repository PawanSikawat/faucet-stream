name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - run: cargo test --workspace --all-features

  # Verify each feature compiles in isolation (catches accidental cross-feature deps)
  feature-check:
    name: Feature isolation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          # Sources
          - source-rest
          - source-graphql
          - source-xml
          - source-grpc
          - source-postgres
          - source-mysql
          - source-sqlite
          - source-s3
          - source-mongodb
          - source-redis
          - source-webhook
          - source-csv
          - source-elasticsearch
          # Sinks
          - sink-bigquery
          - sink-postgres
          - sink-jsonl
          - sink-snowflake
          - sink-mysql
          - sink-sqlite
          - sink-s3
          - sink-mongodb
          - sink-redis
          - sink-csv
          - sink-elasticsearch
          - sink-http
          - sink-stdout
          # State-store backends
          - state-redis
          - state-postgres
          # Aggregates
          - source
          - sink
          - state
          - full
          # CLI build matrix — verify the binary builds with every default-on
          # feature plus a slim "only the bare minimum" combo.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-feat-${{ matrix.feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-feat-${{ matrix.feature }}-
      - run: cargo check -p faucet-stream --no-default-features --features ${{ matrix.feature }}

  cli-build:
    name: CLI build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Defaults pull in every connector; the slim profile covers the
        # smallest interesting combination so accidental cross-feature deps
        # surface immediately.
        features:
          - "full"
          - "source-rest,sink-jsonl,sink-stdout,transforms"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cli-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cli-
      - run: cargo build -p faucet-cli --no-default-features --features "${{ matrix.features }}"
