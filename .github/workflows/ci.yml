name: CI

on:
  # Run on PRs, and on pushes to main — the latter so the Coverage job uploads
  # main-branch coverage to Codecov (the badge tracks branch/main) and so merge
  # commits themselves get CI-verified (PR CI only tests the PR head).
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"
  # Harden against transient crates.io connectivity drops seen on GitHub-hosted
  # runners (`curl failed` / `SSL_read: unexpected eof` / connection reset) that
  # abort cargo during dependency download. Retry more, and disable HTTP/2
  # multiplexing to avoid the "Error in the HTTP2 framing layer" download
  # failures specifically (forces HTTP/1.1).
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-docs-
      # Fail on any rustdoc warning (broken intra-doc links, etc.) so the
      # docs.rs render stays clean. The `doc_cfg` feature-badge path itself is
      # nightly-only and exercised by docs.rs, not here.
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        # The all-features instrumented build (bundled DuckDB + the full
        # connector tree) exceeds the hosted runner's free disk. Drop the
        # large preinstalled toolchains we never use (~25-30 GB).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - name: Run workspace tests
        # Integration tests boot Docker containers via testcontainers, whose
        # in-process (bollard) image pull intermittently fails with
        # "bytes remaining on stream". That flake is transient (the same test
        # passes on a re-run), so retry the suite a few times: a genuine test
        # failure still fails the job after the retries are exhausted.
        run: |
          for attempt in 1 2 3; do
            echo "::group::cargo test (attempt $attempt)"
            if cargo test --workspace --all-features; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::workspace tests failed on attempt $attempt (often a flaky Docker image pull); retrying in 20s"
            sleep 20
          done
          echo "::error::workspace tests failed after 3 attempts"
          exit 1
      - name: Run serve-ui and serve-openapi tests in isolation
        # Explicitly target the embedded-console tests with serve-ui so the
        # feature-gated #![cfg(feature = "serve-ui")] gate is exercised and
        # the OpenAPI two-way sync test runs against the console-enabled router.
        run: cargo test -p faucet-cli --features serve-ui --test serve_ui --test serve_openapi

  # Verify each feature compiles in isolation (catches accidental cross-feature deps)
  feature-check:
    name: Feature isolation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          # Sources
          - source-rest
          - source-graphql
          - source-xml
          - source-grpc
          - source-postgres
          - source-postgres-cdc
          - source-mysql
          - source-mysql-cdc
          - source-mssql
          - source-sqlite
          - source-s3
          - source-mongodb
          - source-mongodb-cdc
          - source-redis
          - source-webhook
          - source-websocket
          - source-csv
          - source-elasticsearch
          - source-kafka
          - source-kinesis
          - source-parquet
          - source-delta
          - source-gcs
          - source-bigquery
          - source-snowflake
          - source-spanner
          - source-singer
          # Sinks
          - sink-bigquery
          - sink-iceberg
          - sink-postgres
          - sink-jsonl
          - sink-snowflake
          - sink-mysql
          - sink-mssql
          - sink-sqlite
          - sink-s3
          - sink-mongodb
          - sink-redis
          - sink-csv
          - sink-elasticsearch
          - sink-http
          - sink-stdout
          - sink-kafka
          - sink-kinesis
          - sink-spanner
          - sink-parquet
          - sink-delta
          - sink-gcs
          # Kafka extras
          - kafka-schema-registry
          # State-store backends
          - state-redis
          - state-postgres
          # Aggregates
          - source
          - sink
          - state
          - auth
          - full
          - compression
          # Encryption at rest (state bookmarks + JSONL/DLQ, #207)
          - encryption
          # Quality checks
          - quality
          - quality-jsonschema
          # Data contracts
          - contract
          # PII detection + column-level masking
          - masking
          # OpenLineage emission
          - lineage
          - lineage-kafka
          # SQL transform (embedded DuckDB)
          - transform-sql
          # Scheduler (CLI-only)
          - schedule
          # HTTP control plane (CLI-only) + its persistent run-history backends + embedded web console
          - serve
          - serve-history-postgres
          - serve-history-sqlite
          - serve-ui
          # Data Movement Catalog (CLI-only; implies serve + lineage)
          - catalog
          # Event-driven triggers (CLI-only)
          - triggers
          - triggers-object-store
          - triggers-redis
          - triggers-kafka
          # Notification / incident routing (CLI-only)
          - notify
          # Local dev loop — `faucet dev` filesystem watch (CLI-only)
          - cli-dev
          # Live terminal UI — `faucet run --tui` (CLI-only)
          - cli-tui
          # Secrets backends
          - secrets-vault
          - secrets-aws-sm
          - secrets-gcp-sm
          - secrets-azure-kv
          # CLI build matrix — verify the binary builds with every default-on
          # feature plus a slim "only the bare minimum" combo.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-feat-${{ matrix.feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-feat-${{ matrix.feature }}-
      - name: Install librdkafka prerequisites (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - name: Install librdkafka prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl@3 curl
      - name: Check feature in isolation
        run: |
          # Secrets, schedule, serve, catalog, and triggers features live in
          # faucet-cli (CLI layer), not in the faucet-stream umbrella crate.
          # Route accordingly.
          if [[ "${{ matrix.feature }}" == secrets-* || "${{ matrix.feature }}" == "schedule" || "${{ matrix.feature }}" == serve* || "${{ matrix.feature }}" == "catalog" || "${{ matrix.feature }}" == triggers* || "${{ matrix.feature }}" == "notify" || "${{ matrix.feature }}" == "cli-dev" || "${{ matrix.feature }}" == "cli-tui" ]]; then
            cargo check -p faucet-cli --no-default-features --features ${{ matrix.feature }}
          else
            cargo check -p faucet-stream --no-default-features --features ${{ matrix.feature }}
          fi

  cli-build:
    name: CLI build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Defaults pull in every connector; the slim profile covers the
        # smallest interesting combination so accidental cross-feature deps
        # surface immediately. The observability+slim combo specifically
        # guards the observability feature against unexpected cross-feature
        # gating regressions (the "full" entry covers observability+everything
        # because the full aggregate now includes observability).
        features:
          - "full"
          - "source-rest,sink-jsonl,sink-stdout,transforms"
          - "observability,source-rest,sink-jsonl,sink-stdout,transforms"
          - "otel,source-rest,sink-jsonl,sink-stdout,transforms"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: Install librdkafka prerequisites
        if: contains(matrix.features, 'full') || contains(matrix.features, 'kafka')
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cli-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('cli/**/*.rs', 'cli/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cli-
      - run: cargo build -p faucet-cli --no-default-features --features "${{ matrix.features }}"

  observability-bench:
    name: Observability bench (5% regression budget)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-obs-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-obs-bench-
      - name: Run observability benchmark
        run: cargo bench -p faucet-core --bench observability -- --warm-up-time 1 --measurement-time 3 --save-baseline ci
      - name: Check regression threshold
        run: python3 .github/scripts/check_obs_regression.py

  kafka-integration:
    name: Kafka integration tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-kafka-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-kafka-integration-
      # These steps boot Docker containers (Kafka, Elasticsearch) via
      # testcontainers, whose in-process (bollard) image pull intermittently
      # fails with "bytes remaining on stream". The flake is transient, so each
      # command is retried up to 3 times; a genuine failure still fails the job.
      - name: Run kafka source integration tests
        run: |
          for attempt in 1 2 3; do
            cargo test -p faucet-source-kafka --test integration -- --test-threads=1 && exit 0
            echo "::warning::attempt $attempt failed (often a flaky Docker image pull); retrying in 20s"; sleep 20
          done
          exit 1
      - name: Run kafka sink integration tests
        run: |
          for attempt in 1 2 3; do
            cargo test -p faucet-sink-kafka --test integration -- --test-threads=1 && exit 0
            echo "::warning::attempt $attempt failed (often a flaky Docker image pull); retrying in 20s"; sleep 20
          done
          exit 1
      - name: Run kafka schema-registry-enabled tests
        run: |
          for attempt in 1 2 3; do
            cargo test -p faucet-common-kafka --all-features && exit 0
            echo "::warning::attempt $attempt failed (often a flaky Docker image pull); retrying in 20s"; sleep 20
          done
          exit 1
      - name: Run faucet-common-elasticsearch tests
        run: |
          for attempt in 1 2 3; do
            cargo test -p faucet-common-elasticsearch && exit 0
            echo "::warning::attempt $attempt failed (often a flaky Docker image pull); retrying in 20s"; sleep 20
          done
          exit 1

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hard gate: licenses, banned crates, and dependency sources are
      # deterministic and in our control.
      - name: Licenses / bans / sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      # Informational: RustSec advisories. Non-blocking because nearly all live
      # in transitive deps we don't control and the advisory DB updates daily;
      # see the note in deny.toml.
      - name: Advisories (informational)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # Hard gate: the public API must not break without a deliberate major-version
  # bump. `faucet-core` is the one crate every third-party connector depends on
  # (the Faucet Connector Protocol, §8) — a breaking change to its object-safe
  # trait surface would silently break every external `faucet-source-*` /
  # `faucet-sink-*`. cargo-semver-checks compares this revision's public API
  # against the version last published to crates.io and fails on any breaking
  # change; the only sanctioned way past it is bumping the crate's major version
  # (which moves the baseline). Additive changes (new defaulted trait methods,
  # new items) are a minor bump and pass. See CONTRIBUTING.md.
  semver-checks:
    name: API stability (cargo-semver-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-semver-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-semver-
      - name: Check faucet-core public API for breaking changes
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # `faucet-core` at minimum — the required connector-author dependency.
          package: faucet-core
          # Use the 1.96.0 toolchain installed above, not the action's default.
          rust-toolchain: manual

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        # The all-features instrumented build (bundled DuckDB + the full
        # connector tree) exceeds the hosted runner's free disk. Drop the
        # large preinstalled toolchains we never use (~25-30 GB).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: llvm-tools-preview
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-
      # Cover unit + integration tests. The integration tests boot Docker
      # testcontainers whose image pulls intermittently flake, so retry the run
      # like the `test` job does — the final successful attempt re-runs the whole
      # suite, so the reported coverage is always complete. Split run
      # (--no-report) from report so the suite can be retried without
      # regenerating the report each attempt. (cargo-llvm-cov 0.8.5 forbids
      # combining --no-report with --no-clean, so the run uses --no-report alone.)
      - name: Collect coverage (unit + integration)
        run: |
          cargo llvm-cov clean --workspace
          ok=0
          for attempt in 1 2 3; do
            echo "::group::instrumented tests (attempt $attempt)"
            if cargo llvm-cov --no-report --workspace --all-features; then
              echo "::endgroup::"; ok=1; break
            fi
            echo "::endgroup::"
            echo "::warning::instrumented tests failed on attempt $attempt (often a flaky Docker image pull); retrying in 20s"
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::instrumented tests failed after 3 attempts"; exit 1; }
      - name: Generate lcov report
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info \
            --ignore-filename-regex '(/tests?/|/examples?/|/benches?/|build\.rs$)'
      - name: Upload to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
