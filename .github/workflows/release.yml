name: Release (manual fallback)

# Manual release workflow — retained as a fallback for ad-hoc / partial
# releases. The default release path is now `release-plz.yml`, which runs
# automatically on every push to `main` (opens a release PR; publishes on
# merge). Use this workflow only when:
#   - release-plz is unavailable, or
#   - you need a one-off bulk re-publish (e.g. scope=all after a registry
#     incident or a CI regression that broke the automatic flow).
# See CONTRIBUTING.md (#release-process) for the recommended flow.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to release"
        required: true
        type: choice
        options:
          - all         # bump + publish every publishable crate (in rate-limited waves)
          - core        # faucet-core only
          - connectors  # every publishable crate except faucet-core, the umbrella, and faucet-cli
          - umbrella    # faucet-stream umbrella only
          - custom      # specify crates in custom_crates input
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      custom_crates:
        description: "Comma-separated crate names (only when scope=custom), e.g. faucet-sink-postgres,faucet-source-rest"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no publish, no git changes)"
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out (and thus push commits/tags) with an admin PAT, not the
          # bot GITHUB_TOKEN. Two reasons:
          #  1. GitHub suppresses workflow triggers from GITHUB_TOKEN-pushed
          #     refs, so tags pushed here would NOT trigger release-binaries.yml
          #     (no CLI binaries / Homebrew update). A PAT-pushed tag does.
          #  2. With a `main` ruleset bypass for this token/App, the version-bump
          #     commit can push to protected `main` without disabling protection.
          # Falls back to GITHUB_TOKEN if the PAT secret is unset.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      # ── DISABLED 2026-08-07 ──────────────────────────────────────────────
      # This job no longer compiles the workspace (fmt/clippy/test were removed
      # and publishing uses `cargo publish --no-verify`), so nothing fills the
      # disk. Kept commented — re-enable verbatim if a build/verify step that
      # exhausts the runner's ~14 GB disk is ever added back to this workflow.
      #
      # - name: Free up disk space
      #   run: |
      #     sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
      #                 /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      #     sudo docker image prune --all --force || true
      #     df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      # ── DISABLED 2026-08-07 ──────────────────────────────────────────────
      # Needed only to compile the `rdkafka` crate (librdkafka from source).
      # Nothing in this job builds the Kafka connectors anymore (no test step;
      # `cargo publish --no-verify` skips the per-crate build). `ubuntu-latest`
      # already ships build-essential/libssl-dev/cmake for `cargo install
      # cargo-release`. Kept commented — re-enable if a build/verify step that
      # compiles the Kafka crates is added back.
      #
      # - name: Install librdkafka prerequisites
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential

      - name: Install cargo-release
        run: cargo install cargo-release --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # NOTE: fmt / clippy / test are intentionally NOT re-run here — they are
      # already enforced on every push/PR by ci.yml (sharded across the
      # feature matrix). This manual fallback exists to *publish*; cargo-release
      # builds and verifies each crate during `cargo publish`. Re-running the
      # full all-features test in this single job is redundant and was
      # exhausting the runner disk (see "Free up disk space" above).

      # ── Derive publishable crate lists from cargo metadata ────────────
      #
      # Single source of truth — never hand-maintain the list. The previous
      # hardcoded arrays silently drifted and omitted 8 crates (parquet,
      # gcs, sink-stdout, both state backends, faucet-cli), so `scope=all`
      # would have shipped a broken release (#78/#11).
      #
      # `ordered_all` is every publishable workspace member (publish != false)
      # in dependency order, computed with `tsort` over the intra-workspace
      # normal/build deps so the wave-publish step never tries to publish a
      # crate before its dependencies. `ordered_connectors` drops faucet-core,
      # the umbrella, and the CLI binary.
      - name: Compute publishable crate lists
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          set_json=$(echo "$metadata" | jq '[.packages[] | select(.publish==null) | .name]')
          ordered_all=$(
            {
              # Anchor every member to a synthetic root so isolated crates are
              # still emitted, then add a "dep pkg" edge per intra-workspace
              # (non-dev) dependency so tsort orders dependencies first.
              echo "$set_json" | jq -r '.[] | "__root__ \(.)"'
              echo "$metadata" | jq -r --argjson set "$set_json" '
                .packages[] | select(.publish==null) as $p
                | $p.dependencies[]? | select(.kind != "dev")
                | select(.name as $n | $set | index($n))
                | "\(.name) \($p.name)"'
            } | tsort | grep -vx '__root__'
          )
          ordered_connectors=$(echo "$ordered_all" | grep -vxE 'faucet-core|faucet-stream|faucet-cli')

          # Fail fast if the derivation dropped or duplicated a crate (a tsort
          # cycle, a jq-filter regression, a malformed dependency edge). The
          # whole point of deriving the list from `cargo metadata` is that a
          # `scope=all` publish covers *every* publishable member — never ship
          # a silently-partial set the way the old hardcoded arrays did
          # (#78/#11).
          expected=$(echo "$set_json" | jq 'length')
          actual=$(echo "$ordered_all" | grep -c .)
          if [ "$actual" -ne "$expected" ]; then
            echo "ERROR: dependency-ordered list has $actual crate(s) but cargo metadata reports $expected publishable member(s) — tsort dropped or duplicated a crate." >&2
            echo "Derived order was:" >&2
            echo "$ordered_all" | nl >&2
            exit 1
          fi
          dupes=$(echo "$ordered_all" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "ERROR: duplicate crate(s) in the dependency-ordered publish list:" >&2
            echo "$dupes" >&2
            exit 1
          fi
          # The three structural anchors must always be present and publishable.
          for anchor in faucet-core faucet-stream faucet-cli; do
            if ! echo "$ordered_all" | grep -qx "$anchor"; then
              echo "ERROR: expected publishable crate '$anchor' is missing from the derived list — check its 'publish' setting." >&2
              exit 1
            fi
          done

          echo "Publishable crates in dependency order ($actual total):"
          echo "$ordered_all" | nl
          echo "ordered_all=$(echo "$ordered_all" | tr '\n' ' ')" >> "$GITHUB_ENV"
          echo "ordered_connectors=$(echo "$ordered_connectors" | tr '\n' ' ')" >> "$GITHUB_ENV"

      # ── Dry run ───────────────────────────────────────────────────────
      - name: Release (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          SCOPE="${{ inputs.scope }}"
          BUMP="${{ inputs.bump }}"

          read -ra all_crates <<< "$ordered_all"
          read -ra connectors <<< "$ordered_connectors"

          case "$SCOPE" in
            all)        selected=("${all_crates[@]}") ;;
            core)       selected=(faucet-core) ;;
            connectors) selected=("${connectors[@]}") ;;
            umbrella)   selected=(faucet-stream) ;;
            custom)
              IFS=',' read -ra selected <<< "${{ inputs.custom_crates }}"
              selected=("${selected[@]// /}")  # trim whitespace
              ;;
          esac

          PKGS=""
          for c in "${selected[@]}"; do PKGS="$PKGS -p $c"; done

          echo "==> Dry run: cargo release $BUMP $PKGS"
          cargo release "$BUMP" $PKGS --no-confirm --no-push --no-tag --no-publish --verbose

      # ── Real release ──────────────────────────────────────────────────
      #
      # crates.io rate-limits new crate registrations to 5 per window.
      # For "all" and "connectors" scopes, we bump versions first (no publish),
      # then publish in waves of 5 with 15-minute waits between waves.
      # For small scopes (core, umbrella, custom <=5), publish directly.
      #
      - name: Release
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          SCOPE="${{ inputs.scope }}"
          BUMP="${{ inputs.bump }}"

          read -ra all_crates <<< "$ordered_all"
          read -ra connectors <<< "$ordered_connectors"

          case "$SCOPE" in
            all)        selected=("${all_crates[@]}") ;;
            core)       selected=(faucet-core) ;;
            connectors) selected=("${connectors[@]}") ;;
            umbrella)   selected=(faucet-stream) ;;
            custom)
              IFS=',' read -ra selected <<< "${{ inputs.custom_crates }}"
              selected=("${selected[@]// /}")
              ;;
          esac

          # If 5 or fewer crates, publish directly with cargo-release
          if [ ${#selected[@]} -le 5 ]; then
            PKGS=""
            for c in "${selected[@]}"; do PKGS="$PKGS -p $c"; done
            echo "==> Publishing ${#selected[@]} crates directly"
            cargo release "$BUMP" $PKGS --no-confirm --execute
          else
            # Step 1: Bump versions, commit, tag — but don't publish yet
            PKGS=""
            for c in "${selected[@]}"; do PKGS="$PKGS -p $c"; done
            echo "==> Step 1: Bumping versions for ${#selected[@]} crates"
            cargo release "$BUMP" $PKGS --no-confirm --no-publish --execute

            # Step 2: Publish in waves of 5 with 15-minute waits
            WAVE_SIZE=5
            WAVE_WAIT=900  # 15 minutes
            total=${#selected[@]}
            wave=1

            for (( i=0; i<total; i+=WAVE_SIZE )); do
              wave_crates=("${selected[@]:i:WAVE_SIZE}")
              echo ""
              echo "==> Wave $wave: publishing ${wave_crates[*]}"

              for crate in "${wave_crates[@]}"; do
                echo "  Publishing $crate..."
                cargo publish -p "$crate" --no-verify || {
                  echo "  WARNING: $crate publish failed (may already exist), continuing..."
                }
                sleep 5  # small delay between individual publishes
              done

              remaining=$(( total - i - WAVE_SIZE ))
              if [ $remaining -gt 0 ]; then
                echo "==> Waiting ${WAVE_WAIT}s for crates.io rate limit reset..."
                sleep $WAVE_WAIT
              fi

              wave=$((wave + 1))
            done
          fi

      - name: Push tags and commits
        if: ${{ !inputs.dry_run }}
        run: |
          git push --follow-tags origin HEAD
