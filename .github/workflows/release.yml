name: Release

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to release"
        required: true
        type: choice
        options:
          - all         # bump + publish every crate (in rate-limited waves)
          - core        # faucet-core only
          - connectors  # all sources + sinks (not core, not umbrella)
          - umbrella    # faucet-stream umbrella only
          - custom      # specify crates in custom_crates input
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      custom_crates:
        description: "Comma-separated crate names (only when scope=custom), e.g. faucet-sink-postgres,faucet-source-rest"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no publish, no git changes)"
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential

      - name: Install cargo-release
        run: cargo install cargo-release --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # ── Dry run ───────────────────────────────────────────────────────
      - name: Release (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          SCOPE="${{ inputs.scope }}"
          BUMP="${{ inputs.bump }}"

          # Dry run: bump versions locally, no publish, no git changes
          all_crates=(
            faucet-core
            faucet-kafka-common
            faucet-elasticsearch-common
            faucet-gcs-common
            faucet-source-rest faucet-source-graphql faucet-source-xml
            faucet-source-grpc faucet-source-postgres faucet-source-postgres-cdc
            faucet-source-mysql
            faucet-source-sqlite faucet-source-s3 faucet-source-mongodb
            faucet-source-redis faucet-source-webhook faucet-source-csv
            faucet-source-elasticsearch faucet-source-kafka
            faucet-sink-bigquery faucet-sink-postgres faucet-sink-jsonl
            faucet-sink-snowflake faucet-sink-mysql faucet-sink-sqlite
            faucet-sink-s3 faucet-sink-mongodb faucet-sink-redis
            faucet-sink-csv faucet-sink-elasticsearch faucet-sink-http
            faucet-sink-kafka
            faucet-stream
          )
          connectors=(
            faucet-kafka-common
            faucet-elasticsearch-common
            faucet-gcs-common
            faucet-source-rest faucet-source-graphql faucet-source-xml
            faucet-source-grpc faucet-source-postgres faucet-source-postgres-cdc
            faucet-source-mysql
            faucet-source-sqlite faucet-source-s3 faucet-source-mongodb
            faucet-source-redis faucet-source-webhook faucet-source-csv
            faucet-source-elasticsearch faucet-source-kafka
            faucet-sink-bigquery faucet-sink-postgres faucet-sink-jsonl
            faucet-sink-snowflake faucet-sink-mysql faucet-sink-sqlite
            faucet-sink-s3 faucet-sink-mongodb faucet-sink-redis
            faucet-sink-csv faucet-sink-elasticsearch faucet-sink-http
            faucet-sink-kafka
          )

          case "$SCOPE" in
            all)      selected=("${all_crates[@]}") ;;
            core)     selected=(faucet-core) ;;
            connectors) selected=("${connectors[@]}") ;;
            umbrella) selected=(faucet-stream) ;;
            custom)
              IFS=',' read -ra selected <<< "${{ inputs.custom_crates }}"
              selected=("${selected[@]// /}")  # trim whitespace
              ;;
          esac

          PKGS=""
          for c in "${selected[@]}"; do PKGS="$PKGS -p $c"; done

          echo "==> Dry run: cargo release $BUMP $PKGS"
          cargo release "$BUMP" $PKGS --no-confirm --no-push --no-tag --no-publish --verbose

      # ── Real release ──────────────────────────────────────────────────
      #
      # crates.io rate-limits new crate registrations to 5 per window.
      # For "all" and "connectors" scopes, we bump versions first (no publish),
      # then publish in waves of 5 with 15-minute waits between waves.
      # For small scopes (core, umbrella, custom <=5), publish directly.
      #
      - name: Release
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          SCOPE="${{ inputs.scope }}"
          BUMP="${{ inputs.bump }}"

          all_crates=(
            faucet-core
            faucet-kafka-common
            faucet-elasticsearch-common
            faucet-gcs-common
            faucet-source-rest faucet-source-graphql faucet-source-xml
            faucet-source-grpc faucet-source-postgres faucet-source-postgres-cdc
            faucet-source-mysql
            faucet-source-sqlite faucet-source-s3 faucet-source-mongodb
            faucet-source-redis faucet-source-webhook faucet-source-csv
            faucet-source-elasticsearch faucet-source-kafka
            faucet-sink-bigquery faucet-sink-postgres faucet-sink-jsonl
            faucet-sink-snowflake faucet-sink-mysql faucet-sink-sqlite
            faucet-sink-s3 faucet-sink-mongodb faucet-sink-redis
            faucet-sink-csv faucet-sink-elasticsearch faucet-sink-http
            faucet-sink-kafka
            faucet-stream
          )
          connectors=(
            faucet-kafka-common
            faucet-elasticsearch-common
            faucet-gcs-common
            faucet-source-rest faucet-source-graphql faucet-source-xml
            faucet-source-grpc faucet-source-postgres faucet-source-postgres-cdc
            faucet-source-mysql
            faucet-source-sqlite faucet-source-s3 faucet-source-mongodb
            faucet-source-redis faucet-source-webhook faucet-source-csv
            faucet-source-elasticsearch faucet-source-kafka
            faucet-sink-bigquery faucet-sink-postgres faucet-sink-jsonl
            faucet-sink-snowflake faucet-sink-mysql faucet-sink-sqlite
            faucet-sink-s3 faucet-sink-mongodb faucet-sink-redis
            faucet-sink-csv faucet-sink-elasticsearch faucet-sink-http
            faucet-sink-kafka
          )

          case "$SCOPE" in
            all)        selected=("${all_crates[@]}") ;;
            core)       selected=(faucet-core) ;;
            connectors) selected=("${connectors[@]}") ;;
            umbrella)   selected=(faucet-stream) ;;
            custom)
              IFS=',' read -ra selected <<< "${{ inputs.custom_crates }}"
              selected=("${selected[@]// /}")
              ;;
          esac

          # If 5 or fewer crates, publish directly with cargo-release
          if [ ${#selected[@]} -le 5 ]; then
            PKGS=""
            for c in "${selected[@]}"; do PKGS="$PKGS -p $c"; done
            echo "==> Publishing ${#selected[@]} crates directly"
            cargo release "$BUMP" $PKGS --no-confirm --execute
          else
            # Step 1: Bump versions, commit, tag — but don't publish yet
            PKGS=""
            for c in "${selected[@]}"; do PKGS="$PKGS -p $c"; done
            echo "==> Step 1: Bumping versions for ${#selected[@]} crates"
            cargo release "$BUMP" $PKGS --no-confirm --no-publish --execute

            # Step 2: Publish in waves of 5 with 15-minute waits
            WAVE_SIZE=5
            WAVE_WAIT=900  # 15 minutes
            total=${#selected[@]}
            wave=1

            for (( i=0; i<total; i+=WAVE_SIZE )); do
              wave_crates=("${selected[@]:i:WAVE_SIZE}")
              echo ""
              echo "==> Wave $wave: publishing ${wave_crates[*]}"

              for crate in "${wave_crates[@]}"; do
                echo "  Publishing $crate..."
                cargo publish -p "$crate" --no-verify || {
                  echo "  WARNING: $crate publish failed (may already exist), continuing..."
                }
                sleep 5  # small delay between individual publishes
              done

              remaining=$(( total - i - WAVE_SIZE ))
              if [ $remaining -gt 0 ]; then
                echo "==> Waiting ${WAVE_WAIT}s for crates.io rate limit reset..."
                sleep $WAVE_WAIT
              fi

              wave=$((wave + 1))
            done
          fi

      - name: Push tags and commits
        if: ${{ !inputs.dry_run }}
        run: |
          git push --follow-tags origin HEAD
