version: 1
default_environment: dev
project_id: faucet-bench
# Meltano project for the faucet-stream comparison benchmark.
# Scenario A: tap-csv -> target-jsonl. Scenario B: tap-postgres -> target-jsonl.
#
# Plugin pip_urls are pinned so the comparison is reproducible. The Meltano
# version itself is pinned in the venv by run-bench.sh (recorded via pip freeze
# into benchmarks/results/versions.txt).
environments:
  - name: dev
plugins:
  extractors:
    - name: tap-csv
      variant: meltanolabs
      # MeltanoLabs tap-csv is not on PyPI — install from a pinned git tag.
      pip_url: git+https://github.com/MeltanoLabs/tap-csv.git@v1.3.2
      config:
        files:
          - entity: bench
            path: ../data/bench.csv
            keys:
              - id
    - name: tap-postgres
      variant: meltanolabs
      pip_url: meltanolabs-tap-postgres==0.9.0
      # Connection is injected at runtime from $BENCH_PG_URL by run-bench.sh
      # (TAP_POSTGRES_SQLALCHEMY_URL). No credentials are committed.
      config:
        default_replication_method: FULL_TABLE
      # Sync only the benchmark table (else tap-postgres discovers every table).
      select:
        - public-bench.*
  loaders:
    - name: target-jsonl
      variant: andyh1203
      pip_url: target-jsonl==0.1.4
      config:
        destination_path: output
    - name: target-postgres
      variant: meltanolabs
      # A modern release — older pins (0.0.x) bundle an ancient singer_sdk that
      # imports `pkg_resources`, removed from modern setuptools on Python 3.12.
      pip_url: meltanolabs-target-postgres==0.8.0
      # Scenario C (sink-bound): tap-postgres -> target-postgres. Connection is
      # injected at runtime from $BENCH_PG_URL by run-bench.sh
      # (TARGET_POSTGRES_SQLALCHEMY_URL). No credentials are committed. Writes to
      # its own schema so it never collides with faucet's `bench_dest` table.
      config:
        default_target_schema: bench_meltano
        # Pin the write batch to match faucet's 5000-row source page (see
        # ../faucet/postgres_to_postgres.yaml) so Scenario C compares like-for-
        # like batch sizes — the gap is not a batching artifact. target-postgres
        # also exposes an opt-in COPY loader (`use_copy: true`, default off);
        # it is left off here so this row measures its multi-row INSERT path.
        batch_size_rows: 5000
